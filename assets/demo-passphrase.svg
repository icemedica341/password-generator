<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 466" width="760" height="466">
  <rect x="4" y="4" width="760" height="466" rx="10" fill="#00000040" />
  <rect x="0" y="0" width="760" height="466" rx="10" fill="#1e1e2e" />
  <rect x="0" y="0" width="760" height="32" rx="10" fill="#181825" />
  <rect x="0" y="22" width="760" height="10" fill="#1e1e2e" />
  <circle cx="24" cy="11" r="6" fill="#f38ba8" opacity="0.9" />
  <circle cx="46" cy="11" r="6" fill="#f9e2af" opacity="0.9" />
  <circle cx="68" cy="11" r="6" fill="#a6e3a1" opacity="0.9" />
  <text x="380.0" y="11" dominant-baseline="central" text-anchor="middle" fill="#6c7086" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="12">Password Generator — Passphrase Mode</text>
  <clipPath id="body-clip">
    <rect x="0" y="32" width="760" height="434" />
  </clipPath>
  <g clip-path="url(#body-clip)">
    <text x="20" y="52" fill="#a6e3a1" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14">>>> Hello, and welcome to the Password Generator! 🔑</text>
    <text x="20" y="74" fill="#6c7086" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14">>>> To quit at any point, type: "quit", "q", "exit", "e"</text>
    <text x="20" y="96" fill="#cdd6f4" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14" />
    <text x="20" y="118" fill="#6c7086" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14">  Type 'p' for password or 'ph' for passphrase.</text>
    <text x="20" y="140" fill="#cdd6f4" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14" />
    <text x="20" y="162" fill="#a6e3a1" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14">Password or Passphrase: ph</text>
    <text x="20" y="184" fill="#6c7086" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14">  Length must be between 4 and 20.</text>
    <text x="20" y="206" fill="#a6e3a1" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14">Enter length of words: 5</text>
    <text x="20" y="228" fill="#a6e3a1" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14">>>> Enter separator (Default '_'): -</text>
    <text x="20" y="250" fill="#cdd6f4" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14" />
    <text x="20" y="272" fill="#6c7086" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14">  Choose a random capitalisation option:</text>
    <text x="20" y="294" fill="#6c7086" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14">  first, last, any-one, all</text>
    <text x="20" y="316" fill="#a6e3a1" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14">Your choice: all</text>
    <text x="20" y="338" fill="#cdd6f4" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14" />
    <text x="20" y="360" fill="#f9e2af" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14">This is your password: REuse-WISTe-oCHLoCRatIcaLLY-WakE-deceivINglY</text>
    <text x="20" y="382" fill="#cdd6f4" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14" />
    <text x="20" y="404" fill="#a6e3a1" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14">Generate another? (y/n) n</text>
    <text x="20" y="426" fill="#6c7086" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14">Exiting Program...</text>
    <text x="20" y="448" fill="#a6e3a1" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="14">Have a nice day ahead! 😄</text>
  </g>
</svg>
